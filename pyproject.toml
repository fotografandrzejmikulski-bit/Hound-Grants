[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hound-eval"
version = "0.1.0"
description = "Execution-grounded benchmark scaffolding for procedural compliance of long-horizon AI agents."
requires-python = ">=3.10"
authors = [{name = "Andrzej Mikulski", email = "mojealterego21@gmail.com"}]
readme = "README.md"
license = {file = "LICENSE"}

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
