name: HOUND CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest
      - name: Install package
        run: pip install -e .
      - name: Run tests
        run: pytest
